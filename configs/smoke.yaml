run:
  id: null
  seed: 7
  description: "Fast smoke test; not a research result"

data:
  source: "ken_french"
  reference_dir: "data/reference"
  factors: ["MKT_RF", "SMB", "HML", "RMW", "CMA", "MOM"]
  risk_free: "RF"
  start: "2000-01-31"
  end: null

features:
  return_lags: [0, 1, 5, 11]
  vol_window: 12
  dropna: true

split:
  min_train: 60
  test_step: 1
  holdout_start: "2016-01-31"

models:
  - name: one_over_n
    kind: allocator
    method: equal
  - name: static_mv
    kind: forecast
    method: static_mv
    params: {shrinkage: 0.2}
  - name: ridge
    kind: forecast
    method: ridge
    params: {alpha: 10.0, shrinkage: 0.2}
  - name: moe
    kind: forecast
    method: moe
    params:
      n_experts: 2
      n_restarts: 1
      max_iter: 10
      tol: 1.0e-5
      ridge_alpha: 1.0
      gating_l2: 0.01
      covariance_shrinkage: 0.2
      gating_steps: 4
      gating_lr: 0.5
      min_responsibility: 1.0e-4

decision:
  utility: mean_variance
  risk_aversion: 2.0
  constraints:
    long_only: true
    fully_invested: true
    max_weight: 0.35
    turnover_cap: null
  cost:
    one_way_bps: 10.0
    strategy_drag_bps_per_month: 0.0
  solver:
    name: slsqp
    max_iter: 300
    ftol: 1.0e-9
    fallback_max_rate: 0.10

evaluation:
  primary_metric: sharpe
  bootstrap:
    n_repetitions: 100
    block_length: 6
    seed: 7
  deflated_sharpe:
    enabled: true
    n_trials: 4
  power:
    alpha: 0.05
    power: 0.80

output:
  runs_dir: "runs"
  reports_dir: "reports"
  save_plots: true
